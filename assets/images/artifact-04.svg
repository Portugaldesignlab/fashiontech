<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800">
  <!-- Heritage, Reimagined — cream cable knit, rose blooms, slate-blue leaves, gold buds -->
  <defs>
    <radialGradient id="bg" cx="34%" cy="22%" r="120%">
      <stop offset="0" stop-color="#f0eadb"/><stop offset="1" stop-color="#d8d0bc"/>
    </radialGradient>
    <pattern id="k" width="10" height="7" patternUnits="userSpaceOnUse">
      <path d="M0 7 L5 1 L10 7" fill="none" stroke="rgba(120,110,88,.16)" stroke-width="1.5"/>
    </pattern>
    <g id="d8">
      <ellipse cx="0" cy="-30" rx="12" ry="26"/>
      <ellipse cx="0" cy="-30" rx="12" ry="26" transform="rotate(45)"/>
      <ellipse cx="0" cy="-30" rx="12" ry="26" transform="rotate(90)"/>
      <ellipse cx="0" cy="-30" rx="12" ry="26" transform="rotate(135)"/>
      <ellipse cx="0" cy="-30" rx="12" ry="26" transform="rotate(180)"/>
      <ellipse cx="0" cy="-30" rx="12" ry="26" transform="rotate(225)"/>
      <ellipse cx="0" cy="-30" rx="12" ry="26" transform="rotate(270)"/>
      <ellipse cx="0" cy="-30" rx="12" ry="26" transform="rotate(315)"/>
    </g>
    <path id="pp" d="M0 6 C 10 -10 10 -38 0 -54 C -10 -38 -10 -10 0 6 Z"/>
  </defs>

  <rect width="600" height="800" fill="url(#bg)"/>

  <!-- slate-blue chain leaves -->
  <g fill="#7e98ab">
    <use href="#pp" transform="translate(260,380) rotate(40) scale(1.9)"/>
    <use href="#pp" transform="translate(290,420) rotate(120) scale(1.7)"/>
    <use href="#pp" transform="translate(470,440) rotate(-30) scale(1.8)"/>
    <use href="#pp" transform="translate(130,560) rotate(70) scale(1.8)"/>
    <use href="#pp" transform="translate(360,580) rotate(-100) scale(1.6)"/>
    <use href="#pp" transform="translate(90,260) rotate(-50) scale(1.5)"/>
    <use href="#pp" transform="translate(520,260) rotate(35) scale(1.5)"/>
    <use href="#pp" transform="translate(250,720) rotate(15) scale(1.6)"/>
  </g>
  <!-- green leaves -->
  <g fill="#3c6b46">
    <use href="#pp" transform="translate(220,250) rotate(-35) scale(1.3)"/>
    <use href="#pp" transform="translate(360,210) rotate(45) scale(1.2)"/>
    <use href="#pp" transform="translate(420,640) rotate(140) scale(1.3)"/>
    <use href="#pp" transform="translate(170,420) rotate(-120) scale(1.2)"/>
    <use href="#pp" transform="translate(500,560) rotate(80) scale(1.1)"/>
    <use href="#pp" transform="translate(60,680) rotate(-20) scale(1.1)"/>
  </g>

  <!-- rose blooms -->
  <g fill="#d8345b"><use href="#d8" transform="translate(180,190) scale(1.4)"/></g>
  <g fill="#e87aa0"><use href="#d8" transform="translate(410,310) scale(1.1)"/></g>
  <g fill="#d8345b"><use href="#d8" transform="translate(430,540) scale(1.2)"/></g>
  <g fill="#e87aa0"><use href="#d8" transform="translate(210,500) scale(1)"/></g>
  <g fill="#e87aa0"><use href="#d8" transform="translate(330,680) scale(.85)"/></g>
  <g fill="#d8345b"><use href="#d8" transform="translate(110,680) scale(.7)"/></g>
  <g fill="#9a7fae"><use href="#d8" transform="translate(530,680) scale(.7)"/></g>

  <!-- beaded centers -->
  <g fill="#5d4a20" stroke="#b3a23a" stroke-width="3">
    <circle cx="180" cy="190" r="15"/><circle cx="410" cy="310" r="12"/>
    <circle cx="430" cy="540" r="13"/><circle cx="210" cy="500" r="11"/>
    <circle cx="330" cy="680" r="9"/><circle cx="110" cy="680" r="8"/>
    <circle cx="530" cy="680" r="8"/>
  </g>

  <!-- gold mini-blooms -->
  <g fill="#b3a23a">
    <use href="#d8" transform="translate(300,120) scale(.45)"/>
    <use href="#d8" transform="translate(500,170) scale(.45)"/>
    <use href="#d8" transform="translate(80,370) scale(.45)"/>
    <use href="#d8" transform="translate(540,420) scale(.4)"/>
    <use href="#d8" transform="translate(60,140) scale(.4)"/>
  </g>
  <g fill="#5d4a20">
    <circle cx="300" cy="120" r="6"/><circle cx="500" cy="170" r="6"/>
    <circle cx="80" cy="370" r="6"/><circle cx="540" cy="420" r="5"/><circle cx="60" cy="140" r="5"/>
  </g>

  <!-- rib cuff -->
  <rect width="600" height="18" fill="#e6dfcd"/>
  <path d="M0 18 q8 10 16 0 q8 10 16 0 q8 10 16 0 q8 10 16 0 q8 10 16 0 q8 10 16 0 q8 10 16 0 q8 10 16 0 q8 10 16 0 q8 10 16 0 q8 10 16 0 q8 10 16 0 q8 10 16 0 q8 10 16 0 q8 10 16 0 q8 10 16 0 q8 10 16 0 q8 10 16 0 q8 10 16 0 q8 10 16 0 q8 10 16 0 q8 10 16 0 q8 10 16 0 q8 10 16 0 q8 10 16 0 q8 10 16 0 q8 10 16 0 q8 10 16 0 q8 10 16 0 q8 10 16 0 q8 10 16 0 q8 10 16 0 q8 10 16 0 q8 10 16 0 q8 10 16 0 q8 10 16 0 q8 10 16 0 q4 5 8 0 L600 0 L0 0 Z" fill="#e6dfcd"/>

  <rect width="600" height="800" fill="url(#k)"/>
</svg>
