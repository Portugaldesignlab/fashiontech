<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800">
  <!-- Retro-Future Bloom — steel-blue crochet, flat sixties petals, gold piping -->
  <defs>
    <radialGradient id="bg" cx="34%" cy="24%" r="120%">
      <stop offset="0" stop-color="#52869e"/><stop offset="1" stop-color="#39657f"/>
    </radialGradient>
    <pattern id="k" width="9" height="6" patternUnits="userSpaceOnUse">
      <path d="M0 6 L4.5 1 L9 6" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="1.4"/>
    </pattern>
    <g id="r6">
      <ellipse cx="0" cy="-24" rx="15" ry="20"/>
      <ellipse cx="0" cy="-24" rx="15" ry="20" transform="rotate(60)"/>
      <ellipse cx="0" cy="-24" rx="15" ry="20" transform="rotate(120)"/>
      <ellipse cx="0" cy="-24" rx="15" ry="20" transform="rotate(180)"/>
      <ellipse cx="0" cy="-24" rx="15" ry="20" transform="rotate(240)"/>
      <ellipse cx="0" cy="-24" rx="15" ry="20" transform="rotate(300)"/>
    </g>
    <g id="burst">
      <ellipse cx="0" cy="-22" rx="4" ry="18"/>
      <ellipse cx="0" cy="-22" rx="4" ry="18" transform="rotate(30)"/>
      <ellipse cx="0" cy="-22" rx="4" ry="18" transform="rotate(60)"/>
      <ellipse cx="0" cy="-22" rx="4" ry="18" transform="rotate(90)"/>
      <ellipse cx="0" cy="-22" rx="4" ry="18" transform="rotate(120)"/>
      <ellipse cx="0" cy="-22" rx="4" ry="18" transform="rotate(150)"/>
      <ellipse cx="0" cy="-22" rx="4" ry="18" transform="rotate(180)"/>
      <ellipse cx="0" cy="-22" rx="4" ry="18" transform="rotate(210)"/>
      <ellipse cx="0" cy="-22" rx="4" ry="18" transform="rotate(240)"/>
      <ellipse cx="0" cy="-22" rx="4" ry="18" transform="rotate(270)"/>
      <ellipse cx="0" cy="-22" rx="4" ry="18" transform="rotate(300)"/>
      <ellipse cx="0" cy="-22" rx="4" ry="18" transform="rotate(330)"/>
    </g>
  </defs>

  <rect width="600" height="800" fill="url(#bg)"/>

  <!-- sage crochet patches -->
  <g fill="#8fae9b" opacity=".5">
    <ellipse cx="140" cy="160" rx="120" ry="90"/>
    <ellipse cx="480" cy="620" rx="130" ry="100"/>
    <ellipse cx="60" cy="560" rx="90" ry="110"/>
  </g>

  <!-- sixties blooms -->
  <g fill="#e8821e"><use href="#r6" transform="translate(380,420) scale(1.6)"/></g>
  <circle cx="380" cy="420" r="18" fill="#9fb48a"/>

  <g fill="#e9e4d2"><use href="#r6" transform="translate(240,560) scale(1.8)"/></g>
  <g fill="#233a72"><use href="#r6" transform="translate(240,560) scale(.8)"/></g>
  <circle cx="240" cy="560" r="12" fill="#9fb48a"/>

  <g fill="#8e5f9e"><use href="#r6" transform="translate(160,300) scale(1.3)"/></g>
  <circle cx="160" cy="300" r="14" fill="#e8821e"/>

  <g fill="#e8821e"><use href="#r6" transform="translate(480,230) scale(1.05)"/></g>
  <circle cx="480" cy="230" r="12" fill="#9fb48a"/>

  <g fill="#c8302a"><use href="#burst" transform="translate(310,180) scale(1.1)"/></g>
  <circle cx="310" cy="180" r="9" fill="#9fb48a"/>

  <g fill="#8e5f9e"><use href="#r6" transform="translate(490,720) scale(.85)"/></g>
  <circle cx="490" cy="720" r="9" fill="#e8821e"/>

  <g fill="#e8821e"><use href="#r6" transform="translate(120,690) scale(.95)"/></g>
  <circle cx="120" cy="690" r="10" fill="#c8302a"/>

  <g fill="#e9e4d2"><use href="#r6" transform="translate(70,430) scale(.8)"/></g>
  <g fill="#233a72"><use href="#r6" transform="translate(70,430) scale(.38)"/></g>

  <g fill="#c8302a"><use href="#burst" transform="translate(540,470) scale(.8)"/></g>
  <circle cx="540" cy="470" r="7" fill="#9fb48a"/>

  <!-- knot dots -->
  <g fill="#e8821e">
    <circle cx="300" cy="320" r="9"/><circle cx="430" cy="560" r="8"/><circle cx="200" cy="80" r="8"/>
  </g>
  <g fill="#c8302a">
    <circle cx="60" cy="120" r="7"/><circle cx="540" cy="100" r="7"/><circle cx="330" cy="720" r="7"/>
  </g>

  <!-- gold piping -->
  <path d="M20 778 Q300 742 580 778" stroke="#c9a44e" stroke-width="10" fill="none" stroke-linecap="round"/>

  <rect width="600" height="800" fill="url(#k)"/>
</svg>
