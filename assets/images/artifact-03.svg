<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800">
  <!-- Living Surfaces — teal crochet ground, rose lilies, coral fronds, sage foliage -->
  <defs>
    <radialGradient id="bg" cx="36%" cy="24%" r="120%">
      <stop offset="0" stop-color="#3a7681"/><stop offset="1" stop-color="#24525c"/>
    </radialGradient>
    <pattern id="k" width="10" height="7" patternUnits="userSpaceOnUse">
      <path d="M0 7 L5 1 L10 7" fill="none" stroke="rgba(255,255,255,.10)" stroke-width="1.5"/>
    </pattern>
    <path id="pp" d="M0 6 C 10 -10 10 -38 0 -54 C -10 -38 -10 -10 0 6 Z"/>
    <g id="sage">
      <ellipse cx="-18" cy="0" rx="14" ry="22" transform="rotate(-28 -18 0)"/>
      <ellipse cx="0" cy="-8" rx="14" ry="24"/>
      <ellipse cx="18" cy="0" rx="14" ry="22" transform="rotate(28 18 0)"/>
    </g>
  </defs>

  <rect width="600" height="800" fill="url(#bg)"/>

  <!-- coral fronds -->
  <g stroke="#dd8a2f" stroke-width="9" fill="none" stroke-linecap="round">
    <path d="M120 200 q30 -40 10 -84"/>
    <path d="M120 200 q44 -12 74 -54"/>
    <path d="M120 200 q-24 -44 -54 -60"/>
    <path d="M440 220 q26 -42 6 -84"/>
    <path d="M440 220 q46 -8 70 -50"/>
    <path d="M230 720 q30 -38 12 -80"/>
    <path d="M230 720 q-36 -20 -44 -66"/>
    <path d="M500 560 q24 36 8 78"/>
  </g>

  <!-- sage foliage -->
  <g fill="#93ab8d">
    <use href="#sage" transform="translate(95,640) scale(1.2)"/>
    <use href="#sage" transform="translate(480,460) rotate(20)"/>
    <use href="#sage" transform="translate(260,140) rotate(-15) scale(.9)"/>
    <use href="#sage" transform="translate(380,760) rotate(10)"/>
  </g>

  <!-- rose lily fans -->
  <g transform="translate(310,330) scale(2.1)">
    <use href="#pp" fill="#c94f76" transform="rotate(-66)"/>
    <use href="#pp" fill="#e2698f" transform="rotate(-33)"/>
    <use href="#pp" fill="#d14f7d" transform="rotate(0)"/>
    <use href="#pp" fill="#e2698f" transform="rotate(33)"/>
    <use href="#pp" fill="#c94f76" transform="rotate(66)"/>
  </g>
  <g transform="translate(150,520) rotate(155) scale(1.5)">
    <use href="#pp" fill="#c94f76" transform="rotate(-60)"/>
    <use href="#pp" fill="#e2698f" transform="rotate(-25)"/>
    <use href="#pp" fill="#d14f7d" transform="rotate(10)"/>
    <use href="#pp" fill="#e2698f" transform="rotate(45)"/>
  </g>
  <g transform="translate(430,650) rotate(-35) scale(1.4)">
    <use href="#pp" fill="#e2698f" transform="rotate(-40)"/>
    <use href="#pp" fill="#d14f7d" transform="rotate(0)"/>
    <use href="#pp" fill="#c94f76" transform="rotate(40)"/>
  </g>

  <!-- buds and knots -->
  <g fill="#e2698f">
    <circle cx="60" cy="340" r="9"/><circle cx="540" cy="120" r="9"/>
    <circle cx="330" cy="560" r="8"/><circle cx="70" cy="760" r="8"/>
  </g>
  <g fill="#dd8a2f">
    <circle cx="520" cy="330" r="7"/><circle cx="180" cy="80" r="7"/><circle cx="320" cy="640" r="6"/>
  </g>

  <!-- rib cuff -->
  <rect width="600" height="16" fill="#e2698f"/>

  <rect width="600" height="800" fill="url(#k)"/>
</svg>
